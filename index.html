
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant - Order Food</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">🍽️ Restaurant</div>
    <button id="cartOpen" class="cart-btn">🛒 Cart <span id="cartCount">0</span></button>
  </header>

  <main>
    <section id="loginPage" class="login-page">
      <div class="login-card">
        <div class="food-icon">🍕</div>
        <h1>Welcome!</h1>
        <p>Enter your mobile number to order food.</p>
        <label for="mobile">Mobile Number</label>
        <div class="phone-input">
          <span>+91</span>
          <input id="mobile" type="tel" inputmode="numeric"
            maxlength="10" placeholder="10-digit mobile number">
        </div>
        <p id="loginError" class="error"></p>
        <button id="continueBtn" class="primary-btn">Continue →</button>
        <small>No SMS OTP required</small>
      </div>
    </section>

    <section id="menuPage" class="hidden">
      <div class="welcome">
        <div>
          <h1>Our Menu</h1>
          <p>Fresh food, made with care.</p>
        </div>
        <button id="changeNumber" class="outline-btn">Change Number</button>
      </div>
      <div class="customer-info">📱 Customer: <b id="customerNumber"></b></div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <section id="cartPage" class="hidden">
      <button id="backToMenu" class="outline-btn">← Back to Menu</button>
      <h1>Your Cart</h1>
      <div id="cartItems"></div>
      <div class="cart-summary">
        <h2>Total: <span id="cartTotal">₹0</span></h2>
        <button id="placeOrder" class="primary-btn">Place Order</button>
        <p id="orderMessage"></p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
